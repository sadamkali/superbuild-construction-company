# Site Configuration
[site]
  title            = "SuperBuild Construction Company"
  description      = "SuperBuild Construction Company delivers quality construction, renovation, roofing, concrete, masonry, and project management services with reliable workmanship and professional service."
  tagline          = "Quality Construction. Reliable Service."
  taglineSeparator = ""
  baseUrl          = "https://superbuild-construction-company.vercel.app/"
  logo             = "/images/logo.svg"
  logoAlternate    = ""
  logoText         = "SuperBuild"
  logoWidth        = "24px"
  logoHeight       = "36px"
  trailingSlash = true

  [site.favicon]
    path  = "/images/favicons"
    image = "/images/favicon.png"

[seo]
  author = "SuperBuild Construction Company"
  keywords = [
    "construction company",
    "building construction",
    "residential construction",
    "commercial construction",
    "renovation and remodeling",
    "roofing services",
    "concrete and structural works",
    "masonry and block work"
  ]
  robots = "index, follow"

  [seo.robotsTxt]
    enable   = true
    disallow = []

  [seo.sitemap]
    enable  = true
    exclude = []

[settings]
  blogFolder     = "blog"
  servicesFolder = "services"
  blogPagination = 6
  pagination     = 8
  stickyHeader   = true
  contactFormAction = "https://formsubmit.co/your-email@example.com"
  contactFormProvider = "formsubmit.co"
  footerDescription = ""

  [settings.smoothScroll]
    enable                = true
    respectReducedMotion  = true
    duration              = 1.1
    easing                = "expo"
    smoothWheel           = true
    syncTouch             = false
    wheelMultiplier       = 1
    touchMultiplier       = 1
    anchors               = true
    autoRaf               = true
    stopInertiaOnNavigate = true

  [settings.animation]
    enable               = true
    respectReducedMotion = true
    easing               = "cubic-bezier(0.22, 1, 0.36, 1)"
    duration             = ""
    distance             = "2rem"
    blur                 = "10px"
    rootMargin           = "0px 0px -8% 0px"
    threshold            = 0.14

  [settings.copyright]
    enable = true
    text   = ""

  [settings.subscription]
    enable            = false
    title             = ""
    note              = ""
    formAction        = ""
    mailchimpTagValue = ""

  [settings.multilingual]
    enable               = true
    defaultLanguage      = "en"
    disableLanguages     = ["fr"]
    showDefaultLangInUrl = false

  [settings.contactInfo]
    phone       = ""
    email       = ""
    address     = "Uganda"
    officeHours = "Office Hours: Mon - Sat: 8:00 AM – 6:00 PM"

  [settings.headerOffcanvas]
    enable      = true
    logo        = ""
    description = "SuperBuild Construction Company provides dependable construction services with quality workmanship, careful planning, and professional project delivery."

    [settings.headerOffcanvas.button]
      enable = true
      label  = "Get a Quote"
      url    = "/#contact"

[settings.navigationButton]
  enable = true
  label  = "Get a Quote"
  url    = "/#contact"

[settings.markup.tableOfContents]
  enable     = true
  expanded   = false
  endLevel   = 5
  ordered    = false
  startLevel = 1

[opengraph]
  image       = "/images/og-image.jpg"
  ogLocale    = "en_US"
  ogType      = "website"
  twitter     = ""
  twitterCard = "summary_large_image"

[head]
  content = """
  <script></script>
  """
